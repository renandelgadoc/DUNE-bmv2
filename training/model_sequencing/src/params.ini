[DEFAULT]
log_level = INFO
use_case = TON-IOT
max_usable_cores = 2
chunksize = 1
# force_rewrite = True -> always recompute the confusion matrices instead of
# reusing the cached *_confusion_matrix.csv / *_cm_matrix_cluster.csv in results
force_rewrite = True

[UNSW]
classes_filter = ['Amazon Echo', 'Android Phone', 'Belkin Wemo switch', 'Belkin wemo motion sensor', 'Dropcam', 'HP Printer', 'Insteon Camera', 'Laptop', 'Light Bulbs LiFX Smart Bulb', 'MacBook', 'NEST Protect smoke alarm', 'Netatmo Welcome', 'Netatmo weather station', 'PIX-STAR Photo-frame', 'Samsung Galaxy Tab', 'Samsung SmartCam', 'Smart Things', 'TP-Link Day Night Cloud camera', 'TP-Link Smart plug', 'Triby Speaker', 'Withings Smart Baby Monitor', 'Withings Aura smart sleep sensor', 'Withings Smart scale', 'iHome']
train_data_dir_path = /nas_storage/shared/UNSW_PCAPS/train/train_data_hybrid
test_data_dir_path = /nas_storage/shared/UNSW_PCAPS/test/csv_files
flow_counts_test_file_path = /nas_storage/shared/UNSW_PCAPS/hyb_code/16-10-05-flow-counts.csv
flow_counts_train_file_path = NA
best_models_per_cluster_path = /nas_storage/shared/distributed_in_band/UNSW/SPP/6CL/Best_models_perCluster_with_others_24Classes_6Clusters.csv
results_dir_path = /nas_storage/shared/distributed_in_band/ToN-IoT/SPP/6CL_models/

[TON-IOT]
override_features = True
; classes of the UMA params.ini of the original DUNE repository
classes_filter = ['normal', 'scanning', 'ddos', 'injection', 'password', 'xss', 'ransomware']
train_data_dir_path = %(training_root)s/data_generation/src/output/train/hybrid_data
test_data_dir_path = %(training_root)s/data_generation/src/output/test/hybrid_data
flow_counts_test_file_path = %(training_root)s/data_generation/src/output/test/TON-IOT_test_flow_length.csv
flow_counts_train_file_path = %(training_root)s/data_generation/src/output/train/TON-IOT_train_flow_length.csv
best_models_per_cluster_path = %(training_root)s/cluster_analysis/src/results/perf_results/cluster_info_df.csv
results_dir_path = %(training_root)s/model_sequencing/src/results