# Feature mapping: ML feature name -> P4 properties
# type: "packet" (extracted from headers) or "stateful" (register-based)
# bit_width: P4 bit width of the field
# struct_field: field name in Features_t or StatefullFeatures_t
# key_expr: expression used in table key
# extract_template: template name for extraction in InferenceModel apply (packet features)
# update_logic: template name for register actions + apply (stateful features)
# reg_name: register name (stateful features)

# --- Packet-level features ---

ip.len:
  type: packet
  struct_field: ip_len
  bit_width: 16
  key_expr: "features.ip_len"
  extract_template: ip_len

ip.ttl:
  type: packet
  struct_field: ip_ttl
  bit_width: 8
  key_expr: "features.ip_ttl"
  extract_template: ip_ttl

ip.proto:
  type: packet
  struct_field: ip_proto
  bit_width: 8
  key_expr: "features.ip_proto"
  extract_template: ip_proto

ip.hdr_len:
  type: packet
  struct_field: ip_hdr_len
  bit_width: 4
  key_expr: "features.ip_hdr_len"
  extract_template: ip_hdr_len

srcport:
  type: packet
  struct_field: src_port
  bit_width: 16
  key_expr: "features.src_port"
  extract_template: src_port

dstport:
  type: packet
  struct_field: dst_port
  bit_width: 16
  key_expr: "features.dst_port"
  extract_template: dst_port

tcp.window_size_value:
  type: packet
  struct_field: tcp_window
  bit_width: 16
  key_expr: "features.tcp_window"
  extract_template: tcp_window

tcp.hdr_len:
  type: packet
  struct_field: tcp_len
  bit_width: 4
  key_expr: "features.tcp_len"
  extract_template: tcp_len

udp.length:
  type: packet
  struct_field: udp_len
  bit_width: 16
  key_expr: "features.udp_len"
  extract_template: udp_len

tcp.flags.syn:
  type: packet
  struct_field: tcp_syn
  bit_width: 1
  key_expr: "features.tcp_syn"
  extract_template: tcp_syn

tcp.flags.ack:
  type: packet
  struct_field: tcp_ack
  bit_width: 1
  key_expr: "features.tcp_ack"
  extract_template: tcp_ack

tcp.flags.push:
  type: packet
  struct_field: tcp_psh
  bit_width: 1
  key_expr: "features.tcp_psh"
  extract_template: tcp_psh

tcp.flags.fin:
  type: packet
  struct_field: tcp_fin
  bit_width: 1
  key_expr: "features.tcp_fin"
  extract_template: tcp_fin

tcp.flags.reset:
  type: packet
  struct_field: tcp_rst
  bit_width: 1
  key_expr: "features.tcp_rst"
  extract_template: tcp_rst

tcp.flags.ece:
  type: packet
  struct_field: tcp_ece
  bit_width: 1
  key_expr: "features.tcp_ece"
  extract_template: tcp_ece

