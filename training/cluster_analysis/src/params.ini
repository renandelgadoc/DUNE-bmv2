[DEFAULT]
log_level = INFO
use_case = TON-IOT
force_rewrite = True
grid_search = True
max_usable_cores = 1
chunksize = 1
# Partitioning scheme of the cluster solution being analysed:
#   spp  -> each cluster owns a DISJOINT subset of classes (legacy behaviour)
#   ofsp -> every cluster (view) covers ALL classes, only the feature subset
#           differs; the final score is the performance-weighted ensemble vote
partitioning_type = spp

[UNSW]
