[DEFAULT]
log_level = INFO
use_case = TON-IOT
max_usable_cores = 8
n_views = 5
random_state = 42
n_estimators = 100
max_depth = 15
# Metric maximized when building the views, on the out-of-bag predictions:
#   accuracy -> OOB accuracy; flow_acc -> OOB accuracy weighted by flow;
#   macro_f1 -> OOB macro-F1 weighted by flow
objective = macro_f1
# How a feature is placed:
#   ensemble -> in the view that gives the best score of the ensemble (all views voting)
#   view     -> in the view whose own score it increases the most (former rule)
scope = view

[TON-IOT]
; classes of the UMA params.ini of the original DUNE repository
classes_filter = ['normal', 'scanning', 'ddos', 'injection', 'password', 'xss', 'ransomware']
train_data_dir_path = %(training_root)s/data_generation/src/output/train/hybrid_data
flow_counts_train_file_path = %(training_root)s/data_generation/src/output/train/TON-IOT_train_flow_length.csv
results_dir_path = %(training_root)s/ofsp_partitioning/src/results
inference_point_list = [3]
features_set = feats_no_time

[FEATURES]
feats_all = ["ip.len","ip.ttl","tcp.flags.syn","tcp.flags.ack","tcp.flags.push","tcp.flags.fin","tcp.flags.reset","tcp.flags.ece","ip.proto","srcport","dstport","ip.hdr_len","tcp.window_size_value","tcp.hdr_len","udp.length","Min Packet Length","Max Packet Length","Packet Length Mean","Packet Length Total","UDP Len Min","UDP Len Max","Flow IAT Min","Flow IAT Max","Flow IAT Mean","Time to Inference","SYN Flag Count","ACK Flag Count","PSH Flag Count","FIN Flag Count","RST Flag Count","ECE Flag Count"]
feats_no_time = ["ip.len", "ip.ttl", "tcp.flags.syn", "tcp.flags.ack", "tcp.flags.push", "tcp.flags.fin", "tcp.flags.reset", "tcp.flags.ece", "ip.proto", "srcport", "dstport", "ip.hdr_len", "tcp.window_size_value", "tcp.hdr_len", "udp.length", "Min Packet Length", "Max Packet Length", "Packet Length Total", "SYN Flag Count", "ACK Flag Count", "PSH Flag Count", "FIN Flag Count", "RST Flag Count", "ECE Flag Count"]
; feats_no_time = ["ip.len", "ip.ttl", "tcp.flags.syn", "tcp.flags.ack", "tcp.flags.push", "tcp.flags.fin", "tcp.flags.reset", "tcp.flags.ece", "ip.proto", "srcport", "dstport", "tcp.window_size_value", "tcp.hdr_len", "udp.length", "Min Packet Length", "Max Packet Length", "Packet Length Total", "SYN Flag Count", "ACK Flag Count", "PSH Flag Count", "FIN Flag Count", "RST Flag Count", "ECE Flag Count"]   (repo original, 23 features)
